name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests share one group per PR so a new push cancels the stale run;
# every other event gets its own group, since GitHub keeps one pending run per group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  lsp-bundle:
    name: The bundled language server is the pinned carve-lsp build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: tools/check-lsp-bundle.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The shared-corpus highlighter conformance tests read inputs from the
          # `spec` submodule (markup-carve/carve), so it must be checked out.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One Gradle invocation, so configuration and the daemon are paid once.
      # The two names swapped meaning in the IntelliJ Platform Gradle Plugin 2.x:
      # `verifyPluginStructure` is the descriptor/archive check that 1.x called
      # `verifyPlugin`, and `verifyPlugin` is now the IntelliJ Plugin Verifier that
      # 1.x called `runPluginVerifier`.
      - name: Build, test and verify plugin structure
        run: ./gradlew --no-daemon buildPlugin test verifyPluginStructure

      # The Plugin Verifier downloads and checks every IDE in build.gradle.kts, and
      # a pull request rarely changes what it answers, so it runs after merge.
      # The network drift checks (battery, fence languages, carve-css) live in
      # grammar-drift.yml: upstream moving is not a reason for a PR to fail.
      - name: Run Plugin Verifier
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon verifyPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intellij-carve
          path: build/distributions/*.zip
          if-no-files-found: error

  # The `test` task above forks on the IDE's bundled JBR, so it only ever exercises that
  # one JDK. The live preview runs GraalJS, and Truffle breaks on newer JDKs (23.0.2 called
  # sun.misc.Unsafe.ensureClassInitialized, removed in JDK 24+) - which shipped to users
  # with a green build. Boot a polyglot context on the JDKs users actually run.
  graal-jdk-smoke:
    name: GraalJS boots on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Boot GraalJS on JDK ${{ matrix.jdk }}
        run: ./gradlew --no-daemon graalSmoke -PgraalSmokeJdk=${{ matrix.jdk }}
